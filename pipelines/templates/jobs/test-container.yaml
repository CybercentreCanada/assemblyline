parameters:
  # Additional steps to run before testing starts
  - name: additionalSteps
    type: stepList
    default: []
  # Acts as an explicit image name setting rather than to be derived from component
  - name: imageName
    type: string
  # Working directory
  - name: workingDirectory
    type: string
    default: ""

jobs:
  - job: test_${{ replace(parameters.imageName, '-', '_') }}
    displayName: Test ${{ parameters.imageName }} Image
    steps:
      - checkout: none
      - download: current
        artifact: working
      - task: Docker@2
        displayName: Login to docker registry
        inputs:
          command: login
          containerRegistry: cccstemp
      # run any addtional steps specified
      - ${{ each step in parameters.additionalSteps }} :
        - ${{ step }}
      - script: |
          # Create an override file for the Docker Compose to replace the pytest service with the specified image
          cat <<EOF > override.yml
          services:
            pytest:
              build: !reset null
              image: cccstemp.azurecr.io/${{ parameters.imageName }}:$TAG
              environment:
                CI: "1"
              command: "pip install -r requirements.txt; pytest -rsx --durations=10"
              volumes:
                - .:/test
                - $(Pipeline.Workspace)/working/pipelines/base-config.yaml:/etc/assemblyline/config.yml
              working_dir: /test
          EOF

          # Start all services except pytest
          docker compose up -d --wait $(docker compose config --services | grep -v "pytest")

          # Create the test requirements file from the pyproject.toml file
          python -c "import tomllib; data = tomllib.load(open('../pyproject.toml', 'rb')); deps = data['project']['optional-dependencies']['test']; open('requirements.txt', 'w').write('\n'.join(deps))"

        workingDirectory: ${{ parameters.workingDirectory }}/test
        displayName: Setup environment
      - script: |
          set -exv  # Echo commands before they are run
          # Start up pytest service from Docker Compose and run the tests
          docker compose run --build pytest
        workingDirectory: ${{ parameters.workingDirectory }}/test
        displayName: Run ${{ parameters.imageName }} tests
