stages:
  - stage: build_rust
    displayName: Build Rust Server
    dependsOn: rust_source_setup
    jobs:
      - job: build_rust
        displayName: Build Rust Server
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -exv  # Echo commands before they are run
              if [[ "$TAG" == *stable* ]]; then export BUILD_KIND=stable; else export BUILD_KIND=latest; fi
              export VERSION=${TAG/stable}
              export VERSION=${VERSION/beta/b}
              export SERIES="`expr $TAG : '\([0-9]\+\.[0-9]\+\.\)'`${BUILD_KIND}"

              export RUST_BASE=cccstemp.azurecr.io/assemblyline-rust-builder:latest
              export IMAGE=cccstemp.azurecr.io/assemblyline-rust

              set +xv
              docker pull $RUST_BASE
              docker build --build-arg version=$VERSION \
                           --build-arg version_tag=$TAG \
                           --build-arg tag=$BUILD_KIND \
                           --build-arg build_image=$RUST_BASE \
                           -t $IMAGE:$TAG \
                           -t $IMAGE:$BUILD_KIND \
                           -t $IMAGE:$SERIES . -f ./assemblyline-server/docker/Dockerfile | while read line ; do echo "$(date) | $line"; done;
              docker push $IMAGE -q --all-tags
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust
            displayName: Build Server
  - stage: build_rust_service_base
    displayName: Build Rust Service Base
    dependsOn: [build_base, rust_source_setup]
    jobs:
      - job: build_rust_service_base
        displayName: Build Rust Service Base
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - download: current
            artifact: working
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -exv  # Echo commands before they are run
              if [[ "$TAG" == *stable* ]]; then export BUILD_KIND=stable; else export BUILD_KIND=latest; fi
              export VERSION=${TAG/stable}
              export VERSION=${VERSION/beta/b}
              export SERIES="`expr $TAG : '\([0-9]\+\.[0-9]\+\.\)'`${BUILD_KIND}"

              export BASE=cccstemp.azurecr.io/assemblyline
              export RUST_BASE=cccstemp.azurecr.io/assemblyline-rust-builder:latest
              export IMAGE=cccstemp.azurecr.io/assemblyline-rust-service-base

              mv ../working/dist/ dist

              set +xv
              docker pull $RUST_BASE
              docker build --build-arg version=$VERSION \
                           --build-arg branch=$BUILD_KIND \
                           --build-arg base=$BASE \
                           --build-arg rust_build_image=$RUST_BASE \
                           -t $IMAGE:$TAG \
                           -t $IMAGE:$BUILD_KIND \
                           -t $IMAGE:$SERIES . -f ./assemblyline-service-client/docker/Dockerfile | while read line ; do echo "$(date) | $line"; done;
              docker push $IMAGE -q --all-tags
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust
            displayName: Build Service Base
