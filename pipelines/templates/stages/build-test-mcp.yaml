stages:
  - stage: build_test_mcp
    displayName: Build & Test MCP
    dependsOn: [build_ui]
    jobs:
      - job: build_test_mcp
        timeoutInMinutes: 10
        displayName: Build & Test MCP Image
        steps:
          - checkout: none
          - download: current
            artifact: working
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e

              # Build MCP image
              export IMAGE=cccstemp.azurecr.io/assemblyline-mcp
              docker build --build-arg base=$BASE \
                            --build-arg version=$VERSION \
                            --build-arg branch=$BUILD_TYPE \
                            -t $IMAGE:$TAG -t $IMAGE:$BUILD_TYPE -t $IMAGE:$SERIES \
                            .

            workingDirectory: $(Pipeline.Workspace)/working/assemblyline-mcp
            displayName: Build MCP
          - script: |
              set -e

              export IMAGE=cccstemp.azurecr.io/assemblyline-mcp

              # Create an override file for the Docker Compose services with the specified images and tags
              cat <<EOF > override.yml
              services:
                al_ui:
                  build: !reset null
                  image: cccstemp.azurecr.io/assemblyline-ui:$TAG
                  command: !reset null
                al_mcp:
                  build: !reset null
                  image: $IMAGE:$TAG
                  command: !reset null
                pytest:
                  image: cccstemp.azurecr.io/assemblyline-socketio:$TAG
                  environment:
                    CI: "1"
                  command: bash -c "pip install -r requirements.txt && pytest -rsx --durations=10"
                  volumes:
                    - .:/test
                  working_dir: /test
              EOF

              # Start all services except pytest
              docker compose -f docker-compose.yml -f override.yml up -d --wait $(docker compose config --services | grep -v "pytest")

              # Create the test requirements file from the pyproject.toml file
              python -c "import tomllib; data = tomllib.load(open('../pyproject.toml', 'rb')); deps = data['project']['optional-dependencies']['test']; open('requirements.txt', 'w').write('\n'.join(deps))"

            workingDirectory: $(Pipeline.Workspace)/working/assemblyline-mcp/test
            displayName: Setup environment
          - script: |
              set -e
              export IMAGE=cccstemp.azurecr.io/assemblyline-mcp

              # Start up pytest service from Docker Compose and run the tests
              docker compose -f docker-compose.yml -f override.yml run pytest

              # Push images to registry if tests pass
              docker push $IMAGE -q --all-tags

            workingDirectory: $(Pipeline.Workspace)/working/assemblyline-mcp/test
            displayName: Test MCP
          - script: docker logs ui
            condition: failed()
            displayName: UI Logs
          - script: docker logs mcp
            condition: failed()
            displayName: MCP Logs
          - script: docker logs nginx
            condition: failed()
            displayName: NGINX Logs
