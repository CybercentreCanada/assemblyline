stages:
  - stage: test_ui
    displayName: Test UI
    dependsOn: [build_ui]
    jobs:
      - job: test_ui
        timeoutInMinutes: 10
        displayName: Test UI Image
        steps:
          - checkout: none
          - download: current
            artifact: working
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e

              # Create an override file for the Docker Compose services with the specified images and tags
              cat <<EOF > override.yml
              services:
                al_ui:
                  build: !reset null
                  image: cccstemp.azurecr.io/assemblyline-ui:$TAG
                  volumes:
                al_socketio:
                  build: !reset null
                  image: cccstemp.azurecr.io/assemblyline-socketio:$TAG
                pytest:
                  build: !reset null
                  image: cccstemp.azurecr.io/assemblyline-socketio:$TAG
                  environment:
                    CI: "1"
                  command: "pip install -r requirements.txt; pytest -rsx --durations=10"
                  volumes:
                    - .:/test
                  working_dir: /test
              EOF

              # Start all services except pytest
              docker compose -f docker-compose.yml -f override.yml up -d --wait $(docker compose config --services | grep -v "pytest")

              # Create the test requirements file from the pyproject.toml file
              python -c "import tomllib; data = tomllib.load(open('../pyproject.toml', 'rb')); deps = data['project']['optional-dependencies']['test']; open('requirements.txt', 'w').write('\n'.join(deps))"

            workingDirectory: $(Pipeline.Workspace)/working/assemblyline-ui/test
            displayName: Setup environment
          - script: |
              # Start up pytest service from Docker Compose and run the tests
              docker compose -f docker-compose.yml -f override.yml run pytest
            workingDirectory: $(Pipeline.Workspace)/working/assemblyline-ui/test
            displayName: Test UI
          - script: docker logs al_ui
            condition: failed()
            displayName: UI Logs
          - script: docker logs al_socketio
            condition: failed()
            displayName: SocketIO Logs
          - script: docker logs nginx
            condition: failed()
            displayName: NGINX Logs
