stages:
  - stage: rust_source_setup
    displayName: Get Rust Source
    dependsOn: []
    jobs:
      # Check out source and add tag
      - job: rust_source_setup
        displayName: Get Rust Source
        steps:
          - checkout: RustRepo
            path: assemblyline-rust
            persistCredentials: true
          - script: |
              set -e
              # Figure out what the build kind is
              if [[ "$VERSION" == *stable* ]];
              then
                export BRANCH=main;
              elif [[ "$VERSION" == *dev* ]];
              then
                export BRANCH=dev;
              else
                exit 1;
              fi

              echo "Building $VERSION On branch $BRANCH"
              export VERSION=${VERSION/stable}
              export VERSION=${VERSION/beta/b}

              git fetch origin ${BRANCH}
              git checkout ${BRANCH}
              if [[ "${PUSH_TAGS,,}" == "true" ]];
              then
                # Tag the source with the same tag as the main repo
                git tag ${TAG}
                git push origin ${TAG}
              fi

            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust
            displayName: Tag Source
          - publish: $(Pipeline.Workspace)/assemblyline-rust
            artifact: assemblyline-rust
  - stage: test_rust
    displayName: Test Rust Components
    dependsOn: rust_source_setup
    jobs:
      - job: test_filestore
        dependsOn: []
        displayName: Test Filestore
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e
              # Start all services except cargo test
              docker compose up -d --wait $(docker compose config --services | grep -v cargo_test)

              # Run cargo tests
              docker compose run --build cargo_test
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust/assemblyline-filestore
            displayName: Test Filestore
      - job: test_markings
        dependsOn: []
        displayName: Test Markings
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e
              docker run -v ${PWD}:/usr/src/ \
                        -w /usr/src/ \
                        rust:1.96-trixie \
                        bash -c 'cargo test --target-dir /out'
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust/assemblyline-markings
            displayName: Test Markings
      - job: test_server
        dependsOn: []
        displayName: Test Server
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e
              # Start all services except cargo test
              docker compose up -d --wait $(docker compose config --services | grep -v cargo_test)

              # Run cargo tests
              docker compose run --build cargo_test
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust/assemblyline-server
            displayName: Test Server
      - job: test_environment_template
        dependsOn: []
        displayName: Test Environment Template
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e
              docker run -v ${PWD}:/usr/src/ \
                        -w /usr/src/ \
                        rust:1.96-trixie \
                        bash -c 'cargo test --target-dir /out'
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust/environment_template
            displayName: Test Environment Template
      - job: test_redis_objects
        dependsOn: []
        displayName: Test Redis Objects
        steps:
          - checkout: none
          - download: current
            artifact: assemblyline-rust
          - task: Docker@2
            displayName: Login to docker registry
            inputs:
              command: login
              containerRegistry: cccstemp
          - script: |
              set -e
              # Start all services except cargo test
              docker compose up -d --wait $(docker compose config --services | grep -v cargo_test)

              # Run cargo tests
              docker compose run --build cargo_test
            workingDirectory: $(Pipeline.Workspace)/assemblyline-rust/redis-objects
            displayName: Test Redis Objects
